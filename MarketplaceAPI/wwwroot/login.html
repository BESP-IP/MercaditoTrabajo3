<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <aside class="auth-aside">
    <a class="brand brand--light" href="index.html"><span class="brand__dot"></span>Tienda</a>
    <div class="auth-aside__copy">
      <p class="auth-aside__title">Entra y termina tu compra en segundos.</p>
      <p>Tu sesión se mantiene guardada en este navegador.</p>
    </div>
    <span class="hero__shape hero__shape--a" aria-hidden="true"></span>
    <span class="hero__shape hero__shape--b" aria-hidden="true"></span>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <a class="auth-card__back" href="index.html">‹ Volver al catálogo</a>

      <h1>Iniciar sesión</h1>
      <p class="auth-card__lead">Ingresa tus datos para continuar.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required />
          <small class="field__error" id="emailError" hidden></small>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres" required />
          <small class="field__error" id="passwordError" hidden></small>
        </div>

        <p id="formError" class="form-error" role="alert" hidden></p>

        <button id="submitBtn" class="btn btn--primary btn--block" type="submit">Confirmar</button>
      </form>

      <p class="auth-card__alt">¿No tienes cuenta? <a href="register.html">Crear cuenta</a></p>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
