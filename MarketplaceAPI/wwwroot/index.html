<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda · Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <section class="hero">
    <div class="hero__inner">
      <h1>Todo para tu escritorio, en un solo lugar.</h1>
      <p>Audífonos, teclados, monitores y accesorios para trabajar y jugar mejor.</p>
    </div>
    <span class="hero__shape hero__shape--a" aria-hidden="true"></span>
    <span class="hero__shape hero__shape--b" aria-hidden="true"></span>
  </section>

  <main class="container">
    <div class="section-head">
      <h2>Catálogo</h2>
      <p id="status" class="section-head__status" role="status">Cargando productos…</p>
    </div>

    <section id="productGrid" class="grid" aria-live="polite"></section>
  </main>

  <footer class="footer">Tienda · Interfaz de demostración</footer>

  <script src="common.js"></script>
  <script src="index.js"></script>
</body>
</html>
