<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda · Crear cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <aside class="auth-aside">
    <a class="brand brand--light" href="index.html"><span class="brand__dot"></span>Tienda</a>
    <div class="auth-aside__copy">
      <p class="auth-aside__title">Crea tu cuenta y empieza a comprar.</p>
      <p>Al registrarte se te asigna el rol de comprador.</p>
    </div>
    <span class="hero__shape hero__shape--a" aria-hidden="true"></span>
    <span class="hero__shape hero__shape--b" aria-hidden="true"></span>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <a class="auth-card__back" href="index.html">‹ Volver al catálogo</a>

      <h1>Crear cuenta</h1>
      <p class="auth-card__lead">Regístrate para comprar en la tienda.</p>

      <form id="registerForm">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" maxlength="100" autocomplete="given-name" required />
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" maxlength="100" autocomplete="family-name" required />
        </div>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" maxlength="254" autocomplete="email" placeholder="nombre@correo.com" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required />
        </div>
        <div class="field">
          <label for="password2">Repite la contraseña</label>
          <input id="password2" type="password" minlength="6" autocomplete="new-password" required />
        </div>

        <p id="formError" class="form-error" role="alert" hidden></p>

        <button id="submitBtn" class="btn btn--primary btn--block" type="submit">Crear cuenta</button>
      </form>

      <p class="auth-card__alt">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="register.js"></script>
</body>
</html>
